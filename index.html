<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris za Majo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section id="start-screen" class="start-screen">
      <div class="start-card">
        <h2 class="start-title">Player Select</h2>
        <div class="screen start-body">
        <label class="field">
          <span class="field-label">Name</span>
          <input
            id="player-name-input"
            type="text"
            maxlength="16"
            autocomplete="off"
            placeholder="ENTER NAME"
          />
        </label>
        <button id="start-game-btn" class="primary-btn" type="button" disabled>
          Start Game
        </button>

        <section class="leaderboard">
          <h3 class="leaderboard-title">High Scores</h3>
          <ol id="leaderboard-list" class="leaderboard-list"></ol>
        </section>
        </div>
      </div>
    </section>

    <div id="game-root" class="game-root">
      <div class="app">
        <header class="app-header">
          <h1 class="app-title">Tetris</h1>
          <p class="app-subtitle">Ready? Stack. Clear.</p>
        </header>

        <main class="app-main">
          <section class="game-shell">
            <aside class="side-panel side-panel--left">
              <div class="panel hold-panel">
                <h2>Hold</h2>
                <div class="screen screen--mini">
                  <canvas
                    id="hold-canvas"
                    width="96"
                    height="96"
                    aria-label="Held piece"
                  ></canvas>
                </div>
              </div>

              <div class="panel stats-panel">
                <h2 class="stat-label">Score</h2>
                <div id="score-value" class="stat-value">0</div>
                <h2 class="stat-label">Level</h2>
                <div id="level-value" class="stat-value">1</div>
                <h2 class="stat-label">Lines</h2>
                <div id="lines-value" class="stat-value">0</div>
              </div>
            </aside>

            <div class="board-panel">
              <div class="panel panel--board">
                <div class="screen">
                  <canvas
                    id="game-canvas"
                    width="200"
                    height="400"
                    aria-label="Tetris game board"
                  ></canvas>
                </div>
              </div>
            </div>

            <aside class="side-panel side-panel--right">
              <div class="panel preview-panel">
                <h2>Next</h2>
                <div class="screen next-grid">
                  <canvas
                    id="next1-canvas"
                    width="96"
                    height="96"
                    aria-label="Next piece 1"
                  ></canvas>
                  <canvas
                    id="next2-canvas"
                    width="96"
                    height="96"
                    aria-label="Next piece 2"
                  ></canvas>
                  <canvas
                    id="next3-canvas"
                    width="96"
                    height="96"
                    aria-label="Next piece 3"
                  ></canvas>
                </div>
              </div>
            </aside>

            <div class="button-row">
              <button id="start-btn" type="button">Start</button>
              <button id="restart-btn" type="button">Restart</button>
            </div>
          </section>

          <section id="overlay" class="overlay overlay--hidden" aria-hidden="true">
            <div class="overlay-content">
              <div class="screen overlay-screen">
                <h2 id="overlay-title">Paused</h2>
                <p id="overlay-message">Press Start to begin</p>
              </div>
              <section class="leaderboard overlay-leaderboard">
                <h3 class="leaderboard-title">Top Scores</h3>
                <ol
                  id="leaderboard-list-gameover"
                  class="leaderboard-list"
                  aria-label="Top scores at game over"
                ></ol>
              </section>
              <button id="overlay-restart-btn" type="button">Play Again</button>
            </div>
          </section>
        </main>

        <footer class="app-footer">
          <p id="daily-quote" class="app-quote" aria-live="polite"></p>
        </footer>
      </div>
    </div>

    <script src="scale.js" defer></script>
    <script src="quote.js" defer></script>
    <script src="game.js" defer></script>
  </body>
  </html>
